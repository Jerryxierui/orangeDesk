[package]
name = "orange-skin"
description = "orangeDesk declarative skin layer (L2): one YAML file = one complete desktop, compiled into L1 module config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orange-taskbar = { workspace = true }
orange-wallpaper = { workspace = true }
orange-widgets = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
serde_json = { workspace = true }
