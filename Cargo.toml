[workspace]
resolver = "2"
members = [
    "apps/orange-desk",
    "crates/orange-kernel",
    "crates/orange-module-api",
    "crates/orange-wallpaper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
orange-module-api = { path = "crates/orange-module-api" }
orange-kernel = { path = "crates/orange-kernel" }
orange-wallpaper = { path = "crates/orange-wallpaper" }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 低占用是功能（P1）：release 构建收紧体积与运行时开销
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
